# air/OS: builds the signal_desktop packages (x86_64 and arm64) on every push
# to the airos branch and publishes them to the rolling "latest" release; the
# image builds take them from the package pool. The pipeline lives in
# airos-works/airos-ci (apps/build-app-packages.sh, build_signal_desktop) and
# uses this repository's scripts/haiku and the pool's Aurora package for the
# launcher.
name: air/OS build

on:
  push:
    branches: [airos]
  workflow_dispatch:

jobs:
  airos:
    uses: airos-works/airos-ci/.github/workflows/app.yml@main
    with:
      app: signal_desktop
      repo-dir: signal
      publish-branch: airos
    permissions:
      contents: write
